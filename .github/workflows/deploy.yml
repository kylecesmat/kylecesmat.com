name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only master is deployed. A pull request from this repository would check
# out its own workflow and run it with the production Cloudflare token, and
# the Pages Function in that deployment could read the Spotify secrets.
# CI still builds pull requests. It does not publish them.
jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      dns: ${{ steps.domain.outputs.dns }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not available for this event."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          log=$(mktemp)
          npx wrangler pages deploy dist \
            --project-name=kylecesmat \
            --branch=master \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_SHA" 2>&1 | tee "$log"
          url=$(sed -n 's/.*\(https:\/\/[^[:space:]]*pages\.dev\).*/\1/p' "$log" | head -n 1)
          if [ -z "$url" ]; then
            echo "Wrangler finished without a pages.dev deployment URL."
            exit 1
          fi
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: Attach kylecesmat.com
        id: domain
        if: steps.deploy.outputs.skipped != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cloudflare-domain.mjs
      - name: Write deployment URLs
        if: steps.deploy.outputs.skipped != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Cloudflare Pages"
            echo "- Branch: master"
            echo "- Production: https://kylecesmat.com"
            echo "- Pages: https://kylecesmat.pages.dev"
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Deployment URL: ${DEPLOYMENT_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-pages:
    name: Publish GitHub Pages
    needs: deploy
    if: needs.deploy.outputs.dns == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/github-pages-artifact.mjs
          git -C dist-pages init -b gh-pages
          git -C dist-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist-pages config user.name "github-actions[bot]"
          git -C dist-pages add -A
          git -C dist-pages commit -m "Publish ${GITHUB_SHA}"
          askpass=$(mktemp)
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$GITHUB_TOKEN"' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C dist-pages push --force "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -f "$askpass"
          {
            echo "## GitHub Pages"
            echo "- https://kylecesmat.com"
            echo "The Cloudflare token cannot edit DNS, so the apex stays on this branch."
          } >> "$GITHUB_STEP_SUMMARY"
