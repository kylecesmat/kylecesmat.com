name: Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Push to master deploys the production Pages branch and keeps
# kylecesmat.com attached. Pull requests from this repository deploy
# a preview. Dependabot and fork PRs cannot read Actions secrets, so
# those deploys are skipped; merging to master still publishes.
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not available for this event."
            echo "Dependabot and fork pull requests cannot read Actions secrets."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          log=$(mktemp)
          npx wrangler pages deploy dist \
            --project-name=kylecesmat \
            --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_SHA" 2>&1 | tee "$log"
          url=$(sed -n 's/.*\(https:\/\/[^[:space:]]*pages\.dev\).*/\1/p' "$log" | head -n 1)
          echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: Attach kylecesmat.com
        id: domain
        # Production pushes always reconcile the domain. This branch's pull
        # request does it once, because workflow_dispatch is not available
        # to the GitHub token that opens the pull request.
        if: github.event_name != 'pull_request' || github.head_ref == 'cursor/cloudflare-pages-cd-4768'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cloudflare-domain.mjs
      - name: Publish GitHub Pages
        if: steps.domain.outputs.dns == 'github-pages' && (github.ref == 'refs/heads/master' || github.head_ref == 'cursor/cloudflare-pages-cd-4768')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/github-pages-artifact.mjs
          git -C dist-pages init -b gh-pages
          git -C dist-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist-pages config user.name "github-actions[bot]"
          git -C dist-pages add -A
          git -C dist-pages commit -m "Publish ${GITHUB_SHA}"
          git -C dist-pages push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          {
            echo "## GitHub Pages"
            echo "- https://kylecesmat.com"
            echo "The Cloudflare token cannot edit DNS, so the apex stays on this branch."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write deployment URLs
        if: steps.deploy.outputs.skipped != 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          {
            echo "## Cloudflare Pages"
            echo "- Branch: ${BRANCH}"
            echo "- Production: https://kylecesmat.com"
            echo "- Pages: https://kylecesmat.pages.dev"
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Deployment URL: ${DEPLOYMENT_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
